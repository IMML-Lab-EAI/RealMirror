# Which prims of each scene USD count as one "object" for whole-scene
# annotation, and how they are named.
#
#   split:   prims whose CHILDREN become individual objects (recursive list of
#            prim paths relative to the scene root, e.g. "/model_chopping_board").
#            By default every child of the scene's default prim is one object.
#   labels:  prim path (relative to scene root) -> {name, category[, background]}
#            Anything not listed gets an automatic name derived from the prim
#            name (see realmirror_annot.scene.auto_label).
#   background: large structural prims (walls, floor, whole-room shells) are
#            still rendered (they occlude) and annotated, but flagged.
#
# Categories follow the team's Qwen baseline: object, container, tool, food,
# electronic_device, furniture, support_surface, structural_element.
defaults:
  max_faces_per_object: 150000     # decimation target for the render cache
  max_faces_background: 300000

